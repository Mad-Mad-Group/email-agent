# ─────────────────────────────────────────────
# ClientRadar AI — nginx 配置範本
#
# 用法:
#   Linux:  sudo cp nginx-clientradar.conf /etc/nginx/sites-available/clientradar.conf
#           sudo ln -s /etc/nginx/sites-available/clientradar.conf /etc/nginx/sites-enabled/
#   macOS:  cp nginx-clientradar.conf /opt/homebrew/etc/nginx/servers/clientradar.conf
#
# 部署前需修改:
#   1. server_name → 你嘅 UAT subdomain
#   2. BACKEND_IP  → Backend Mac 嘅內網 IP
#   3. SSL 路徑    → 你嘅證書位置（或刪除 SSL block 用純 HTTP）
# ─────────────────────────────────────────────

# ── 變數提示（nginx 唔支援變數，請手動替換） ──
# BACKEND_IP = 你嘅 Backend Mac 內網 IP（例如 192.168.1.111）
# UAT_DOMAIN = 你嘅 UAT subdomain（例如 uat.clientradar-ai.com）

# ══ HTTP → HTTPS redirect ══
server {
    listen 80;
    server_name uat.clientradar-ai.com;  # ← 改成你嘅 domain

    # 如果只用 HTTP，刪除呢個 block，用下面嘅 HTTP-only block
    return 301 https://$server_name$request_uri;
}

# ══ HTTPS 主配置 ══
server {
    listen 443 ssl http2;
    server_name uat.clientradar-ai.com;  # ← 改成你嘅 domain

    # ── SSL ──
    ssl_certificate     /etc/ssl/clientradar/fullchain.pem;   # ← 改成你嘅證書路徑
    ssl_certificate_key /etc/ssl/clientradar/privkey.pem;     # ← 改成你嘅 key 路徑
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Frontend 靜態檔案 ──
    root /var/www/clientradar;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理 ──
    location /api/ {
        proxy_pass http://192.168.1.111:4000;  # ← 改成 Backend Mac IP
        proxy_http_version 1.1;

        # 標準 proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 支援
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 長時間請求（AI 任務可能需要）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 檔案上傳限制
        client_max_body_size 20M;
    }

    # ── 靜態資源快取 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip 壓縮 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1024;

    # ── 安全 headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ══════════════════════════════════════════════
# 如果暫時唔想搞 SSL，用呢個 HTTP-only 版本
# （刪除上面嘅 HTTPS block，uncomment 下面）
# ══════════════════════════════════════════════

